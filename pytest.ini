[pytest]
# ============================================================
# 「点时成金」测试运行配置
# 一键执行： bash scripts/run_tests.sh
# ============================================================

# —— 测试发现 ——
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# —— 日志（-v 时可直接看到种子/序列化器的 INFO/WARNING）——
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_level = INFO

# —— 默认参数 ——
# 说明：覆盖率与报告由 scripts/run_tests.sh 通过命令行追加，
# 避免本地单跑某个用例时被强制统计覆盖率而变慢。
addopts =
    -ra
    --strict-markers
    --tb=short
    --durations=10

# —— 自定义标记（与 tests/conftest.py 中注册保持一致）——
markers =
    unit: 单元测试（纯函数/算法，无 IO 依赖）
    api: 接口测试（FastAPI TestClient 契约与健壮性）
    integration: 集成测试（数据库 + 序列化 + 业务链路）
    e2e: 端到端测试（前端页面 + 后端接口联动）
    perf: 性能基线测试（响应时间 / 吞吐）
    security: 安全基线测试（注入、越权、信息泄露）
    slow: 耗时较长的用例（可用 -m "not slow" 跳过）
    external: 依赖外部网络或第三方服务的用例（CI 默认跳过）

# —— 告警治理 ——
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
