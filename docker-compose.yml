# 黄金价格预测系统 - 双容器编排
# 启动：docker compose up --build
# 默认 SQLite 模式开箱即用；启用 PostgreSQL 时取消 db 服务注释并设置 DATABASE_URL
services:
  api:
    build: .
    container_name: gold-predictor-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/gold_predictor.db
      - DEMO_MODE=false
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
